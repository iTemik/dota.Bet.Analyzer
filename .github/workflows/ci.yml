name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Run pre-commit checks (lint and format validation)
        run: |
          source .venv/bin/activate
          # Run formatters/linters in check mode (no modifications in CI)
          echo "Running ruff check..."
          ruff check . --output-format=concise || (echo "RUFF CHECK FAILED"; exit 1)
          echo ""

          echo "Running black check..."
          black --check --line-length=120 --diff . || (echo "BLACK CHECK FAILED"; exit 1)
          echo ""

          echo "Running isort check..."
          isort --check-only --profile=black --diff . || (echo "ISORT CHECK FAILED"; exit 1)
          echo ""

          echo "Running other pre-commit hooks..."
          # Run other pre-commit hooks (skip the ones we already checked)
          pre-commit run --all-files
        env:
          SKIP: ruff,black,isort

      - name: Create test results directories
        run: |
          mkdir -p test-results/backend
          mkdir -p test-results/frontend

      - name: Run tests (backend and frontend)
        if: always()
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          artifact: test-reports
          path: |
            **/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Prepare build package
        run: |
          VERSION=$(cat frontend/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          PACKAGE_NAME="dota-bet-analyzer-${VERSION}"
          mkdir -p build/${PACKAGE_NAME}

          # Copy frontend build
          cp -r frontend/dist build/${PACKAGE_NAME}/

          # Copy backend code
          cp -r backend build/${PACKAGE_NAME}/

          # Copy requirements and config files
          cp requirements.txt build/${PACKAGE_NAME}/
          cp pyproject.toml build/${PACKAGE_NAME}/

          # Create zip archive
          cd build
          zip -r "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          cd ..

          # Move to root for artifact upload
          mv build/${PACKAGE_NAME}.zip .
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

      - name: Upload build package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dota-bet-analyzer-*.zip
          retention-days: 30
