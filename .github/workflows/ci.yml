name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Create Python virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Run pre-commit checks (lint and format validation)
        run: |
          source .venv/bin/activate
          # Run formatters/linters in check mode (no modifications in CI)
          ruff check .
          black --check --line-length=120 .
          isort --check-only --profile=black .
          # Run other pre-commit hooks (skip the ones we already checked)
          pre-commit run --all-files
        env:
          SKIP: ruff,black,isort

      - name: Create test results directories
        run: |
          mkdir -p test-results/backend
          mkdir -p test-results/frontend

      - name: Run tests (backend and frontend)
        if: always()
        run: npm test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-results/
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          artifact: test-reports
          path: |
            backend/junit.xml
            frontend/junit.xml
          reporter: java-junit
          fail-on-error: false
