name: Version and Release

on:
  push:
    branches: [ main, master ]

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set version in files
        run: |
          echo "Using GitHub run number as build number: $BUILD_NUMBER"
          # Automatically increment versions only for components with changes
          node scripts/version.js auto increment

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Add VERSION files and updated source files
          git add frontend/VERSION backend/VERSION frontend/src/version.ts
          RELEASE_VERSION=$(node scripts/version.js release get)
          git commit -m "chore: bump version to ${RELEASE_VERSION}" || echo "No changes to commit"

      - name: Push changes
        if: success()
        run: |
          git push origin HEAD:${{ github.ref }} || echo "No changes to push"

      - name: Create Release Tag
        if: success()
        run: |
          RELEASE_VERSION=$(node scripts/version.js release get)
          echo "Creating release tag: v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}" || (echo "Tag already exists, skipping tag creation"; exit 0)
          git push origin "v${RELEASE_VERSION}" || echo "Tag push completed"
