name: Version and Release

on:
  push:
    branches: [ main, master ]

jobs:
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download previous build number
        continue-on-error: true
        run: |
          # Try to download previous build number from artifacts
          # For first run, this will fail and default to 0
          mkdir -p .build-cache
          echo "0" > .build-cache/build-number.txt

      - name: Calculate build number
        id: build
        run: |
          PREV_BUILD=$(cat .build-cache/build-number.txt || echo "0")
          NEW_BUILD=$((PREV_BUILD + 1))
          echo "number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $NEW_BUILD"

      - name: Set version in files
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          node scripts/version.js frontend increment-minor
          node scripts/version.js backend increment-minor
          node scripts/version.js frontend build $BUILD_NUMBER
          node scripts/version.js backend build $BUILD_NUMBER

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json frontend/src/version.ts backend/__init__.py
          FRONTEND_VERSION=$(node scripts/version.js frontend get)
          git commit -m "chore: bump version to ${FRONTEND_VERSION}" || echo "No changes to commit"

      - name: Push changes
        if: success()
        run: |
          git push origin HEAD:${{ github.ref }} || echo "No changes to push"

      - name: Upload build number
        uses: actions/upload-artifact@v4
        with:
          name: build-cache
          path: .build-cache/build-number.txt
          retention-days: 1

      - name: Create Release Tag
        if: success()
        run: |
          FRONTEND_VERSION=$(node scripts/version.js frontend get)
          BACKEND_VERSION=$(node scripts/version.js backend get)
          echo "Frontend version: $FRONTEND_VERSION"
          echo "Backend version: $BACKEND_VERSION"

          # Create tag combining both frontend and backend versions
          RELEASE_VERSION="${FRONTEND_VERSION}-be${BACKEND_VERSION}"
          echo "Creating release tag: v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}" || (echo "Tag already exists, skipping tag creation"; exit 0)
          git push origin "v${RELEASE_VERSION}" || echo "Tag push completed"
