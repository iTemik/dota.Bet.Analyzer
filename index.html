        <script>
            function check() {

            function httpGet(theUrl) {
                var xmlHttp = new XMLHttpRequest();
                xmlHttp.open("GET", theUrl, false); // false for synchronous request
                xmlHttp.send();
                return xmlHttp.responseText;
            }

            // The function makes requests for matches played by a team player to open dota API
            // And @return an array with team statistic of ranked and public games played and winned per each player
            // The funtion is also marks some players to be ignored in the statistic summary
            //
            // @teamPlayers - a list of the players in the team.
            // @team - name of the team

            function prepareTeamStats(teamPlayers, team, key, days) {

                teamStats = [];
                for (var i = 0; i < teamPlayers.length; i++) {
                    // https://api.opendota.com/api/players/[ID]/matches/?api_key=[KEY]&date=60

                    // It looks like key is not longer needed in the request
                    //var lastmatches = "https://api.opendota.com/api/players/" + teamPlayers[i].id + "/matches/?api_key=" + key + "&date=" + days + "";//подготовка текста для отправки запроса
                    var lastmatches = "https://api.opendota.com/api/players/" + teamPlayers[i].id + "/matches/?date=" + days;
                    var reslastmatches = httpGet(lastmatches);//отправка запроса на сервера и ответ
                    var textjson = JSON.parse(reslastmatches);

                    var playerStats = getStats(teamPlayers[i], team, textjson);
                    teamStats.push(playerStats);
                }
                updateIgnoreFlags(teamStats);
                return teamStats;
            }

            // returns a structre with information about games played
            function getStats(player, team, jsontext) {
                var stats = {
                    'team': team,
                    'name': player.name,
                    'id': player.id,
                    'leaderboard_rank': player.leaderboard_rank,
                    'public_games': 0,
                    'public_wins': 0,
                    'ranked_games': 0,
                    'ranked_wins': 0,
                    'ignore_flag': 0, // Flags shows if we should ignore this player in statistic. 0 - don't ignore, 1 - questionable, 2 - must ignore
                };

                for (var i = 0; i < jsontext.length; i++) {

                    let isradiant = true;
                    if (jsontext[i].player_slot > 128) {
                        radiant = false;
                    }

                    if (jsontext[i].game_mode == "2") {//lobby_type равен двум(игры, доступные для публики, но созданые через кастомные лобби), увеличиваем счетчик турнира
                        stats.public_games++;

                        if (jsontext[i].radiant_win && isradiant) {
                            //если победила radiant, и в этой команде был игркок, то накручиваем счетчик побед
                            //если radiant проиграли и и игрок не был в команде, то тоже накрчиваем счетчик
                            stats.public_wins++;
                        }
                        else if (!jsontext[i].radiant_win && !isradiant) {
                            stats.public_wins++;
                        }
                    }

                    if (jsontext[i].game_mode == "22") {//lobby_type равен 22(рранекед), увеличиваем счетчик ранкеда

                        // TODO: it's needed to increment ranked games only for main players and exclude coaches and former players.
                        stats.ranked_games++;
                        if (jsontext[i].radiant_win && isradiant) {

                            //если победила radiant, и в этой команде был игркок, то накрчиваем счетчик побед
                            //если radiant проиграли и и игрок не был в команде, то тоже накрчиваем счетчик
                            stats.ranked_wins++;

                        }
                        else if (!jsontext[i].radiant_win && !isradiant) {
                            stats.ranked_wins++;
                        }
                    }

                }

                console.log("Игрок: " + player.name + " Сыграл: " + parseInt(stats.ranked_games + stats.public_games));
                return stats;
            }


            // Adds players statisticts to a table
            function updateStatsTable(tableID, teamStatsArray) {

                // Get a reference to the table
                let tableRef = document.getElementById(tableID);

                for (var i = 0; i < teamStatsArray.length; i++) {

                    // Insert a row at the end of the table
                    let newRow = tableRef.insertRow(-1);

                    // Insert a cell in the row at index 0
                    let newCell = newRow.insertCell(0);

                    // Append a text node to the  cell
                    let newText = document.createTextNode(teamStatsArray[i].name);
                    if (teamStatsArray[i].ignore_flag == 2) {
                        newCell.style.color = "red";
                        newCell.style.fontWeight = "bold";
                    }
                    else if (teamStatsArray[i].ignore_flag == 1) {
                        newCell.style.color = "teal";
                    }
                    newCell.appendChild(newText);
                    newCell = newRow.insertCell(1);
                    newText = document.createTextNode(teamStatsArray[i].team);
                    newCell.appendChild(newText);

                    newCell = newRow.insertCell(2);
                    newText = document.createTextNode(teamStatsArray[i].id);
                    newCell.appendChild(newText);


                    newCell = newRow.insertCell(3);
                    newText = document.createTextNode(teamStatsArray[i].leaderboard_rank ? teamStatsArray[i].leaderboard_rank : "unknown");
                    newCell.appendChild(newText);

                    newRow = tableRef.insertRow(-1);
                    newCell = newRow.insertCell(0);
                    newText = document.createTextNode('Публичные матчи: Всего/Победы');
                    newCell.appendChild(newText);

                    newCell = newRow.insertCell(1);
                    newText = document.createTextNode(teamStatsArray[i].public_games);
                    newCell.appendChild(newText);

                    newCell = newRow.insertCell(2);
                    newText = document.createTextNode(teamStatsArray[i].public_wins);
                    newCell.appendChild(newText);


                    newCell = newRow.insertCell(3);

                    newText = document.createTextNode(teamStatsArray[i].public_games == 0 ? "0%" : (teamStatsArray[i].public_wins * 100 / teamStatsArray[i].public_games).toFixed(1) + "%");
                    newCell.appendChild(newText);

                    //заполнение третьей стрчоки статистики
                    newRow = tableRef.insertRow(-1);
                    newCell = newRow.insertCell(0);
                    newText = document.createTextNode('Рейтинговые матчи: Всего/Победы');
                    newCell.appendChild(newText);

                    newCell = newRow.insertCell(1);
                    newText = document.createTextNode(teamStatsArray[i].ranked_games);
                    newCell.appendChild(newText);

                    newCell = newRow.insertCell(2);
                    newText = document.createTextNode(teamStatsArray[i].ranked_wins);
                    newCell.appendChild(newText);


                    newCell = newRow.insertCell(3);
                    newText = document.createTextNode(teamStatsArray[i].ranked_games == 0 ? "0%" : (teamStatsArray[i].ranked_wins * 100 / teamStatsArray[i].ranked_games).toFixed(1) + "%");
                    newCell.appendChild(newText);

                    tableRef.insertRow();
                    tableRef.insertRow();
                    tableRef.insertRow();


                }
            }

            // the function should update ignore_flag for passed array of team stats (teamStatsArray)
            // Is some players in the team played the same number of public games but other not we should know this during stats calculation
            // It's important to distinguish a coach from active players and newcomers
            //
            // TODO: The algorithm indentifying coaches may be improved in the future
            function updateIgnoreFlags(teamStatsArray) {
                if (teamStatsArray.length == 0)
                    return;

                goodValues = [];
                for (var i = 0; i < teamStatsArray.length; i++) {
                    if (teamStatsArray[i].public_games > 0) {
                        goodValues.push(teamStatsArray[i].public_games);
                    }
                }

                goodValueIndex = getFirstDupeIndex(goodValues);

                for (var i = 0; i < teamStatsArray.length; i++) {
                    if (teamStatsArray[i].public_games == 0) {
                        teamStatsArray[i].ignore_flag = 2;
                        console.log("The player " + teamStatsArray[i].name + " should be ignored in statistic calculation");
                        continue;
                    }

                    // some players played the same number of games => so we can use them a reference point
                    // of players which statistic we can use to compare with other players in the team.
                    if (goodValueIndex == -1
                            || teamStatsArray[i].public_games != goodValues[goodValueIndex]) {
                        teamStatsArray[i].ignore_flag = 1;
                        console.log("The player " + teamStatsArray[i].name + " may corrupt team statistic");
                    }
                }
            }

            // The function searches for the duplicate values in the array @arr
            // @return index of the first dulpicate or -1 in there is no dupes
            function getFirstDupeIndex (arr) {
                result = -1;
                arr.forEach( (element, index) =>
                    {
                        if (element === 0)
                            return -1; // this is how we can skip elements in forEach
                        if(arr.lastIndexOf(element) !== index)
                        {
                            result = index;
                            return index;
                        }
                    }
				)
                return result;
            }

            function getTeamListText(teamStatsArray) {
                if (teamStatsArray.length == 0)
                    return "<h3>Cannot find team info</h3>";
                text = "<h3>Team: " + teamStatsArray[0].team + "</h3>"
                text += "<br />";
                for (var i = 0; i < teamStatsArray.length; i++) {
                    text += highlightText(teamStatsArray[i].name, teamStatsArray[i].ignore_flag) + "<br />";
                }
                return text;
            }

            function getTeamRating(team_id) {
                var teamInfoUrl = "https://api.opendota.com/api/teams/" + team_id; // updated api url
                var res = httpGet(teamInfoUrl);
                var textjson = JSON.parse(res);
                return {
                    'rating': textjson.rating,
                    'delta': textjson.delta,
                };
            }

            function getStatsSummary(team, team_id, teamStatsArray) {
                var statsSummary = {
                    'team': team,
                    'ranked_games': 0,
                    'public_games': 0,
                    'public_wins': 0,
                    'rating' : 0,
                    'delta' : 0,
                    'games_array': [], // for comparation the number of games played by avg and median
                };
                for (var i = 0; i < teamStatsArray.length; i++) {
                    if (teamStatsArray.ignore_flag == 2)
                        continue;
                    statsSummary.ranked_games += teamStatsArray[i].ranked_games;
                    statsSummary.public_games += teamStatsArray[i].public_games;
                    statsSummary.public_wins += teamStatsArray[i].public_wins;
                    statsSummary.games_array.push(parseInt(teamStatsArray[i].ranked_games + teamStatsArray[i].public_games));
                }

                // get team rating and delta from /teams/<team_id> request
                var teamRating = getTeamRating(team_id);
                statsSummary.rating = teamRating.rating;
                statsSummary.delta = teamRating.delta;

                return statsSummary;
            }

            function CreateVersusTable(tableID, stats1, stats2) {

            // get background colors for versus table.
            //Если разница в играх у первой и второй команды велика,
            //то ячейку красим в зеленый цвет, а лузера в красный
            // mindiff - минимальная разница в единицах, для подсветки, например 10 игр (значение по умолчанию 10)
            // minPercentage - минимальная разница в процентах для подстветки, например 1.3 = это 30 процентов (значение по умолчанию 30%),
            // Returns array with two elements. #0 - color for value1, #2 - color for value2
            // if difference is not so much => retrun null.
            function getVersusColors(value1, value2, mindiff = 10, minPercentage = 1.3) {
                //console.log("определяем цвет " + value1 + " и " + value2);
                let result = null;
                if (Math.abs(value1 - value2) <= mindiff) {
                    return null;// compare numbers if they are bigger than mindif.
                }

                let delta = Math.abs(parseFloat(value1) - parseFloat(value2));
                let BiggerValue = parseFloat(value1);
                let SmallerValue = parseFloat(value2);
                if (value1 > value2) // hit with bigger and smaller.
                {
                    result = ["lightgreen", "lightsalmon"];
                }
                else // miss with bigger and smaller.
                {
                    BiggerValue = value2;
                    SmallerValue = value1;
                    result = ["lightsalmon", "lightgreen"];
                }
                // now we can check persentage.
                //console.log("Now we can check persentage bigger=" + BiggerValue + ", smaller=" + SmallerValue);
                if (value1 == 0 || value2 == 0) { // if one of the values are 0 => highligh without calculation precentage.
                    return result;
                }

                let deltapc = parseFloat(BiggerValue / SmallerValue);
                if (deltapc >= minPercentage)
                    return result;
                else
                    return null;

            }


            //Вычесляем сред.ариф. для массива "nums"
            function average(nums) {
                if (nums.length != 0)
                    return nums.reduce((a, b) => (a + b)) / nums.length;
                else {
                    return 0;

                }
            }




            //Вычесляем сред.ариф. для массива "values"
            function median(values) {
                if (values.length === 0) return 0;//Если игр не было(пустой массив) то мы считаем что игр было сыгранно 0 по медиане

                values.sort(function (a, b) {
                    return a - b;//Сортируем по возврастанию
                });

                var half = Math.floor(values.length / 2);//узнаем где середина отсортированого массива

                if (values.length % 2)
                    return values[half];//Если попали в середину, то выводим  полученый элемент

                return (values[half - 1] + values[half]) / 2.0;//если не попали в середину, выводим сред, ариф. двух ближних к середине элементов
            }

            function highlightText(text, ignoreFlag) {
                switch (ignoreFlag) {
                    case 1:
                        text = '<span style="color:teal">' + text + "</span>";
                        break;
                    case 2:
                        text = '<strong><span style="color:red">' + text + "</span></strong>";
                        break;
                }
                return text;
            }
