            function httpGet(theUrl) {
                var xmlHttp = new XMLHttpRequest();
                xmlHttp.open("GET", theUrl, false); // false for synchronous request
                xmlHttp.send(null);
                return xmlHttp.responseText;
            }





            function updatestats(tableID, player, team, jsontext, stats) {

                // 0)Создаем четыре счетчика, кол-во рейтинговых игр -0, кол-во турнирных игр - 0.
                // 1)В цикле изучаем каждый матч в отдельности
                // 2)Если lobby type равен 2-это турнир, если 7- это рейтинговая игра. Накручяиваем соотвецтвующий счетчик
                // 3)Вычесляем команду игрока, если позиция меньше 128- то это radiant, иначе dire
                // 4)Смотрим какая команда победила по radiant, если это команда игрока, накручиваем счетчик побед  
                let rankedgames = 0;
                let publicgames = 0;
                let rankedwins = 0;
                let publicwins = 0;
                for (var i = 0; i < jsontext.length; i++) {

                    let isradiant = true;
                    if (jsontext[i].player_slot > 128) {
                        radiant = false;

                    }

                    if (jsontext[i].game_mode == "2") {//lobby_type равен двум(игры, доступные для публики, но созданые через кастомные лобби), увеличиваем счетчик турнира
                        publicgames++;
                        stats.public_games++;


                        if (jsontext[i].radiant_win && isradiant) {

                            //если победила radiant, и в этой команде был игркок, то накручиваем счетчик побед
                            //если radiant проиграли и и игрок не был в команде, то тоже накрчиваем счетчик
                            publicwins++;
                            stats.public_wins++;
                        }
                        else if (!jsontext[i].radiant_win && !isradiant) {
                            publicwins++;
                            stats.public_wins++;
                        }
                    }





                    if (jsontext[i].game_mode == "22") {//lobby_type равен 22(рранекед), увеличиваем счетчик ранкеда

                        rankedgames++;//счетчик по игроку
                        stats.ranked_games++;//счетчик по команде
                        if (jsontext[i].radiant_win && isradiant) {

                            //если победила radiant, и в этой команде был игркок, то накрчиваем счетчик побед
                            //если radiant проиграли и и игрок не был в команде, то тоже накрчиваем счетчик
                            rankedwins++;

                        }
                        else if (!jsontext[i].radiant_win && !isradiant) {
                            rankedwins++;
                        }
                    }

                }


                //Когда мы узнает данные об игрока, кладем кол-во матчей(сумма матчей ранкед и публик) в специальный массив, как только мы 
                //  закончили получать всю статистику, мы получиный массив сортируем и отсекаем  всю лишнее
                // при отображении таблицы

                stats.games_array.push(parseInt(rankedgames + publicgames));
                console.log("Игрок: " + player.name + " Сыграл: " + parseInt(rankedgames + publicgames));




                // Get a reference to the table
                let tableRef = document.getElementById(tableID);

                // Insert a row at the end of the table
                let newRow = tableRef.insertRow(-1);

                // Insert a cell in the row at index 0
                let newCell = newRow.insertCell(0);

                // Append a text node to the cell
                let newText = document.createTextNode(player.name);
                newCell.appendChild(newText);

                newCell = newRow.insertCell(1);
                newText = document.createTextNode(team);
                newCell.appendChild(newText);

                newCell = newRow.insertCell(2);
                newText = document.createTextNode(player.account_id);
                newCell.appendChild(newText);


                newCell = newRow.insertCell(3);
                newText = document.createTextNode("text2");
                newCell.appendChild(newText);

                //заполнение второй стрчоки статистики
                newRow = tableRef.insertRow(-1);
                newCell = newRow.insertCell(0);
                newText = document.createTextNode('Кол-во публичных матчей');
                newCell.appendChild(newText);

                newCell = newRow.insertCell(1);
                newText = document.createTextNode(publicgames);
                newCell.appendChild(newText);

                newCell = newRow.insertCell(2);
                newText = document.createTextNode(publicwins);
                newCell.appendChild(newText);


                newCell = newRow.insertCell(3);
                newText = document.createTextNode((publicwins * 100 / publicgames).toFixed(1) + "%");
                newCell.appendChild(newText);

                //заполнение третьей стрчоки статистики


                newRow = tableRef.insertRow(-1);
                newCell = newRow.insertCell(0);
                newText = document.createTextNode('Кол-во рейтенговых матчей');
                newCell.appendChild(newText);

                newCell = newRow.insertCell(1);
                newText = document.createTextNode(rankedgames);
                newCell.appendChild(newText);

                newCell = newRow.insertCell(2);
                newText = document.createTextNode(rankedwins);
                newCell.appendChild(newText);


                newCell = newRow.insertCell(3);
                newText = document.createTextNode((rankedwins * 100 / rankedgames).toFixed(1) + "%");
                newCell.appendChild(newText);


                tableRef.insertRow();

                tableRef.insertRow();

                tableRef.insertRow();



            }



            function CreateVersusTable(tableID, stats1, stats2) {

                let tableRef = document.getElementById(tableID);
                //let header = tableRef.createTHead();
                //let newRow = header.insertRow(0);  
                let newRow = tableRef.insertRow(-1);
                //заолняем нулевой стобец
                let newCell = newRow.insertCell(0);
                let newText = document.createTextNode("");//текст нулевого стобца(A1)
                newCell.appendChild(newText);
                //заполняем первый  стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(stats1.team);//текст первого стобца(B1)
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(stats2.team);//текст второго стобца(С1)
                newCell.appendChild(newText);

                var colors = getVersusColors(stats1.ranked_games, stats2.ranked_games, 10, 1.3); // get bg colors for ranked games. if difference > 10 games and 30%
                newRow = tableRef.insertRow(-1);
                //заполняем нулевой стобец
                newCell = newRow.insertCell(0);
                newText = document.createTextNode("Кол-во рейтинговых игр суммарное");//текст нулевого стобца(A2)
                newCell.appendChild(newText);
                //заполняем первый стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(stats1.ranked_games);//текст первого стобца(B2);
                if (colors)
                    newCell.bgColor = colors[0]; // get first bg color if it's relevant
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(stats2.ranked_games);//текст второго стобца(С2)
                if (colors)
                    newCell.bgColor = colors[1];
                newCell.appendChild(newText);

                // считаем разницу но уже для публичных игр.
                colors = getVersusColors(stats1.public_games, stats2.public_games, 10, 1.3); // get bg colors for public. if difference > 10 games and 30%
                //заполнение третьей стрчоки статистики
                newRow = tableRef.insertRow(-1);
                //заполняем нулевой стобец
                newCell = newRow.insertCell(0);
                newText = document.createTextNode("Кол-во публичных игр суммарное");//текст нулевого стобца(A3)
                newCell.appendChild(newText);
                //заполняем первый стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(stats1.public_games);//текст первого стобца(B3)
                if (colors != null)
                    newCell.bgColor = colors[0]; // get first bg color if it's relevant
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(stats2.public_games);//текст второго стобца(С3)
                if (colors)
                    newCell.bgColor = colors[1]; // get first bg color if it's relevant
                newCell.appendChild(newText);

                var winrateTeam1 = stats1.public_games > 0 ? stats1.public_wins * 100 / stats1.public_games : 0;
                var winrateTeam2 = stats2.public_games > 0 ? stats2.public_wins * 100 / stats2.public_games : 0;
                colors = getVersusColors(winrateTeam1, winrateTeam2, 8, 1.2); // get bg colors for public. we assume that 8% winrate is significant.
                //заполнение третьей стрчоки статистики
                newRow = tableRef.insertRow(-1);
                //заполняем нулевой стобец
                newCell = newRow.insertCell(0);
                newText = document.createTextNode("Процент побед публичных игр");//текст нулевого стобца(A3)
                newCell.appendChild(newText);
                //заполняем первый стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(winrateTeam1.toFixed(1) + "%");//текст первого стобца(B3)
                if (colors != null)
                    newCell.bgColor = colors[0]; // get first bg color if it's relevant
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(winrateTeam2.toFixed(1) + "%");//текст второго стобца(С3)
                if (colors)
                    newCell.bgColor = colors[1]; // get first bg color if it's relevant
                newCell.appendChild(newText);


                colors = getVersusColors(average(stats1.games_array), average(stats2.games_array), 10, 1.2); // highlight if players played more than 10 games in average
                //заполнение четвертой стрчоки статистики
                newRow = tableRef.insertRow(-1);
                //заполняем нулевой стобец
                newCell = newRow.insertCell(0);
                newText = document.createTextNode("Среднее кол-во игр на игрока");//текст нулевого стобца(A4)
                newCell.appendChild(newText);
                //заполняем первый стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(average(stats1.games_array));//текст нулевого стобца(A4)
                if (colors)
                    newCell.bgColor = colors[0]; // get first bg color if it's relevant
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(average(stats2.games_array));//текст нулевого стобца(A4)
                if (colors)
                    newCell.bgColor = colors[1]; // get first bg color if it's relevant
                newCell.appendChild(newText);





                colors = getVersusColors(median(stats1.games_array), median(stats2.games_array), 10, 1.2); // highlight if players played more than 10 games in average
                //заполнение четвертой стрчоки статистики
                newRow = tableRef.insertRow(-1);
                //заполняем нулевой стобец
                newCell = newRow.insertCell(0);
                newText = document.createTextNode("Половина игроков сыграло не более: ");//текст нулевого стобца(A5)
                newCell.appendChild(newText);
                //заполняем первый стобец
                newCell = newRow.insertCell(1);
                newText = document.createTextNode(median(stats1.games_array));//текст нулевого стобца(A5)
                if (colors)
                    newCell.bgColor = colors[0]; // get first bg color if it's relevant
                newCell.appendChild(newText);
                //заполняем второй стобец
                newCell = newRow.insertCell(2);
                newText = document.createTextNode(median(stats2.games_array));//текст нулевого стобца(A5)
                if (colors)
                    newCell.bgColor = colors[1]; // get first bg color if it's relevant
                newCell.appendChild(newText);


            }

            // get background colors for versus table. 
            //Если разница в играх у первой и второй команды велика, 
            //то ячейку красим в зеленый цвет, а лузера в красный
            // mindiff - минимальная разница в единицах, для подсветки, например 10 игр (значение по умолчанию 10)
            // minPercentage - минимальная разница в процентах для подстветки, например 1.3 = это 30 процентов (значение по умолчанию 30%),
            // Returns array with two elements. #0 - color for value1, #2 - color for value2
            // if difference is not so much => retrun null.
            function getVersusColors(value1, value2, mindiff = 10, minPercentage = 1.3) {
                //console.log("определяем цвет " + value1 + " и " + value2);
                let result = null;
                if (Math.abs(value1 - value2) <= mindiff) {
                    return null;// compare numbers if they are bigger than mindif.
                }

                let delta = Math.abs(value1 - value2);
                let BiggerValue = value1;
                let SmallerValue = value2;
                if (value1 > value2) // hit with bigger and smaller.
                {
                    result = ["lightgreen", "lightsalmon"];
                }
                else // miss with bigger and smaller.
                {
                    BiggerValue = value2;
                    SmallerValue = value1;
                    result = ["lightsalmon", "lightgreen"];
                }
                // now we can check persentage.
                //console.log("Now we can check persentage bigger=" + BiggerValue + ", smaller=" + SmallerValue);
                if (value1 == 0 || value2 == 0) { // if one of the values are 0 => highligh without calculation precentage.
                    return result;
                }


                let deltapc = parseFloat(BiggerValue / SmallerValue);
                if (deltapc >= minPercentage)
                    return result;
                else
                    return null;

            }
            //Функция сортирует кол-во матчей игрока от большего к меньшему
            ///Функция выплевывает отсортированый массив
            function simpleSort(matchesByTeam) {
                // console.log("сортируем массив:" + matchesByTeam);
                for (var i = 0, endI = matchesByTeam.length - 1; i < endI; i++) {

                    for (var j = 0, endJ = endI - i; j < endJ; j++) {
                        if (matchesByTeam[j] < matchesByTeam[j + 1]) {
                            var swap = matchesByTeam[j];
                            matchesByTeam[j] = matchesByTeam[j + 1];
                            matchesByTeam[j + 1] = swap;
                        }
                    }
                }
                // console.log("Выводим массив "+matchesByTeam);
                var result = matchesByTeam.slice(0, 5);
                console.log("Выводим массив " + result);
                return result;//Возвращем первые пять значений, больше пяти игроков не имеет смысла, использховать в рассчете




            }

            //Вычесляем сред.ариф. для массива "nums"
            function average(nums) {
                if (nums.length != 0)
                    return nums.reduce((a, b) => (a + b)) / nums.length;
                else {
                    return 0;

                }
            }




            //Вычесляем сред.ариф. для массива "values"
            function median(values) {
                if (values.length === 0) return 0;//Если игр не было(пустой массив) то мы считаем что игр было сыгранно 0 по медиане

                values.sort(function (a, b) {
                    return a - b;//Сортируем по возврастанию  
                });

                var half = Math.floor(values.length / 2);//узнаем где середина отсортированого массива 

                if (values.length % 2)
                    return values[half];//Если попали в середину, то выводим  полученый элемент                                                                    

                return (values[half - 1] + values[half]) / 2.0;//если не попали в середину, выводим сред, ариф. двух ближних к середине элементов                    
            }








        </script>
